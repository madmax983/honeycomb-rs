name: Mutation Testing

on:
  # Run on PR to main
  pull_request:
    branches: [main]
  # Manual trigger
  workflow_dispatch:
  # Weekly schedule (Sundays at 2am)
  schedule:
    - cron: '0 2 * * 0'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  mutants:
    name: Mutation Testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run mutation tests
        run: |
          cargo mutants --all-features --output mutants.out
        continue-on-error: true

      - name: Archive mutants results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-results
          path: mutants.out/

      - name: Check mutation score
        run: |
          # Parse caught/total from mutants output
          CAUGHT=$(grep -oP 'caught \K\d+' mutants.out/mutants.out.txt || echo "0")
          TOTAL=$(grep -oP 'total \K\d+' mutants.out/mutants.out.txt || echo "1")

          if [ "$TOTAL" -eq 0 ]; then
            echo "No mutants generated"
            exit 0
          fi

          SCORE=$(awk "BEGIN {printf \"%.1f\", ($CAUGHT/$TOTAL)*100}")
          echo "Mutation Score: ${SCORE}%"
          echo "mutation_score=${SCORE}" >> $GITHUB_OUTPUT

          # Fail if mutation score is below 80%
          if (( $(echo "$SCORE < 80.0" | bc -l) )); then
            echo "❌ Mutation score ${SCORE}% is below 80% threshold"
            echo "Review mutants.out/missed.txt for uncaught mutants"
            exit 1
          fi

          echo "✅ Mutation score ${SCORE}% meets threshold"

      - name: Comment mutation score on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const mutantsOut = fs.readFileSync('mutants.out/mutants.out.txt', 'utf8');
            const caught = mutantsOut.match(/caught (\d+)/)?.[1] || '0';
            const total = mutantsOut.match(/total (\d+)/)?.[1] || '0';
            const score = total > 0 ? ((caught / total) * 100).toFixed(1) : '0.0';

            const body = `## 🧬 Mutation Testing Results

            - **Mutation Score**: ${score}%
            - **Caught**: ${caught}/${total} mutants
            - **Threshold**: 80%

            ${score >= 80 ? '✅ Tests are effective!' : '❌ Tests need improvement - review missed mutants'}

            <details>
            <summary>View full report</summary>

            \`\`\`
            ${mutantsOut}
            \`\`\`
            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
